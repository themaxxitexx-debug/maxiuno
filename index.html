<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maxii</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 24px;
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;

<body>
    <h1>Hola maxi</h1>
    <img src="descarga.jpg" alt="Imagen de Maxii">
